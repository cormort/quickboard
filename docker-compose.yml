services:
  quickboard:
    build: .
    container_name: quickboard
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks: [quickboard]
    expose: ["8000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  backup:
    build: .
    container_name: quickboard-backup
    restart: unless-stopped
    env_file: .env
    command: ["/app/scripts/backup-loop.sh"]
    environment:
      DATABASE_PATH: /data/quickboard.db
      BACKUP_DIR: /backups
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    networks: [quickboard]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    depends_on:
      quickboard:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    container_name: quickboard-caddy
    restart: unless-stopped
    depends_on:
      quickboard:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [quickboard]
    security_opt: ["no-new-privileges:true"]

networks:
  quickboard:

volumes:
  caddy_data:
  caddy_config:
