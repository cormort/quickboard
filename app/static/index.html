<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1412"><title>自架快貼佈告欄</title><link rel="manifest" href="/static/manifest.webmanifest"><link rel="stylesheet" href="/static/style.css"></head><body><header><div><b>📌 自架快貼</b><small id="roomLabel">安全登入版</small></div><div><button id="theme">☀️</button><button id="adminBtn" hidden>管理後台</button><button id="logout" hidden>登出</button></div></header><main><section id="auth" class="card"><h1>登入</h1><input id="username" placeholder="帳號"><input id="password" type="password" placeholder="密碼至少 12 字元"><input id="display" placeholder="顯示名稱（註冊時填）"><input id="registerInvite" placeholder="邀請碼（註冊必填）"><div class="grid"><button id="login" class="primary">登入</button><button id="register">註冊</button></div><p id="authMsg"></p></section><section id="app" hidden><section class="card"><div class="grid"><select id="rooms"></select><button id="createRoom">建立房間</button><button id="joinRoom">輸入邀請碼</button><button id="invite">邀請</button></div></section><section class="card"><textarea id="text" rows="4" maxlength="5000" placeholder="輸入或貼上文字"></textarea><div class="grid"><button id="paste">📋 貼上</button><button id="send" class="primary">送出</button></div><small id="sync"></small></section><section id="messages"></section></section><section id="adminPanel" hidden><section class="card"><div class="admin-head"><h2>🛡️ 管理員後台</h2><button id="closeAdmin">關閉</button></div><div id="adminStats" class="stats"></div></section><section class="card"><h3>訊息清理</h3><div class="grid"><select id="cleanupRoom"><option value="">全部房間</option></select><input id="cleanupDays" type="number" min="0" max="3650" value="90" aria-label="保留天數"><button id="cleanupOld" class="primary">刪除逾期訊息</button><button id="cleanupAll" class="danger">清空所選範圍</button><button id="cleanupInvites">清理失效邀請</button></div><small>保留天數 0 代表刪除目前時間以前的所有訊息。清空操作不可復原，請先備份。</small></section><section class="card"><h3>使用者</h3><div id="adminUsers" class="admin-list"></div></section><section class="card"><h3>房間</h3><div id="adminRooms" class="admin-list"></div></section><section class="card"><div class="admin-head"><h3>操作日誌與審計紀錄</h3><a id="auditExport" class="button-link" href="/api/admin/audit.csv">匯出 CSV</a></div><div class="audit-filters"><select id="auditAction"><option value="">全部操作</option><option value="user.toggle_active">帳號狀態</option><option value="room.delete">刪除房間</option><option value="messages.cleanup">逾期清理</option><option value="messages.cleanup_all">清空訊息</option><option value="invites.cleanup">邀請清理</option></select><label>起日<input id="auditFrom" type="date"></label><label>迄日<input id="auditTo" type="date"></label><button id="auditSearch">查詢</button></div><div id="auditLogs" class="audit-list"></div><div class="pager"><button id="auditPrev">上一頁</button><span id="auditPageInfo"></span><button id="auditNext">下一頁</button></div></section></section></main><dialog id="modal"><form method="dialog"><button class="close">×</button><h2 id="modalTitle"></h2><div id="modalBody"></div></form></dialog><div id="toast"></div><script src="/static/app.js"></script></body></html>
